<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Sports Connections - RESULTS page
    The player's stats: four summary boxes, wins broken down by
    sport, and a list of recent games.
    Styles: css/style.css (section 6 = Results page)
    All numbers here are placeholder data for the mockup.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Results · Sports Connections</title>
  <!-- Google Fonts: load "Libre Franklin" (weights 400-800).
       The two preconnect links start the connection to Google's
       servers early so the font downloads faster. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
  <!-- Shared stylesheet ("../" = go up one folder from pages/) -->
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/results.js" defer></script>
</head>
<body>
<main>
  <!-- ===== Site header (same on every page) =====
       Logo + site title, then the main navigation tabs. The link
       for the current page has aria-current="page", which the CSS
       shows as a purple tab and screen readers announce as
       "current page". -->
  <header class="header">
    <div class="brand">
      <!-- Logo: four empty squares colored by the CSS (.logo).
           aria-hidden="true" = purely decorative, so screen
           readers skip it. -->
      <span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <h1>Sports Connections</h1>
    </div>
    <nav class="pages" aria-label="Main">
      <a href="../index.html">Play</a>
      <a href="CreatePage.html">Create</a>
      <a href="ResultsPage.html" aria-current="page">Results</a>
    </nav>
  </header>
  <!-- ===== Page heading ===== -->
  <div class="sectionTitle">
    <h2>Your Results</h2>
  </div>
  <!-- ===== Summary stat boxes =====
       Shown as a 2x2 grid on phones and one row of four on
       tablet/desktop. In each box the number is a <p class="statValue">
       (not a heading, since it's data) and the label is a plain <p>. -->
  <div class="mainResults">
    <div class="stat">
      <p class="statValue" id="gamesPlayed"></p>
      <p>Games Played</p>
    </div>
    <div class="stat">
      <p class="statValue" id="winRate"></p>
      <p>Win Rate</p>
    </div>
    <div class="stat">
      <p class="statValue" id="currentStreak"></p>
      <p>Current Streak</p>
    </div>
    <div class="stat">
      <p class="statValue" id="bestStreak"></p>
      <p>Best Streak</p>
    </div>
  </div>
  <div class="specificResults" id="bySport">
    <!-- ===== Wins by sport =====
         Each row: sport, a win-rate bar, and the record.
         <meter value="6" max="7"> draws the bar from the numbers
         themselves, so no inline styles are needed. -->
    <h3>By Sport</h3>

  </div>
  <div class="specificResults" id="recentGames">
    <!-- ===== Recent games =====
         Each row starts with a mini grid showing how the puzzle went,
         like the Connections share result: one row of four squares per
         guess, colored by each player's real category (c1 = yellow ...
         c4 = purple). A mixed row = a wrong guess. -->
    <h3>Recent Games</h3>
  </div>
</main>
</body>
</html>
