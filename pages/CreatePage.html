<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Sports Connections - CREATE page
    A form for building your own puzzle: four categories, each
    with four athletes. Rows go from easiest (yellow) to hardest
    (purple).
    Styles: css/style.css (section 5 = Create page)
    This page lives in pages/, so links back to the site root use
    "../" (e.g. ../css/style.css, ../index.html).
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Puzzle · Sports Connections</title>
  <!-- Google Fonts: load "Libre Franklin" (weights 400-800).
       The two preconnect links start the connection to Google's
       servers early so the font downloads faster. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&display=swap">
  <!-- Shared stylesheet ("../" = go up one folder from pages/) -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main>
  <!-- ===== Site header (same on every page) =====
       Logo + site title, then the main navigation tabs. The link
       for the current page has aria-current="page", which the CSS
       shows as a purple tab and screen readers announce as
       "current page". -->
  <header class="header">
    <div class="brand">
      <!-- Logo: four empty squares colored by the CSS (.logo).
           aria-hidden="true" = purely decorative, so screen
           readers skip it. -->
      <span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <h1>Sports Connections</h1>
    </div>
    <nav class="pages" aria-label="Main">
      <a href="../index.html">Play</a>
      <a href="CreatePage.html" aria-current="page">Create</a>
      <a href="ResultsPage.html">Results</a>
    </nav>
  </header>
  <!-- ===== Page heading + instructions ===== -->
  <div class="sectionTitle">
    <h2>Create a Puzzle</h2>
    <p>Make four groups of four players. No player can appear twice.</p>
  </div>
  <!-- ===== Puzzle form =====
       Everything the player fills in is inside this <form>, so the
       Submit button submits it and the browser checks the
       "required" fields first.
       There is no server yet, so a valid submit just reloads the page. -->
  <form class="createForm">
    <!-- Username + Sport, side by side. Each <label for="..."> is
         linked to its field by the field's id, so clicking the label
         focuses the field and screen readers read the label. -->
    <div class="puzzleInfo">
      <div class="infoForm" id="user">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Your Public Username" name="username">
      </div>
      <div class="infoForm">
        <label for="sport">Sport</label>
        <select id="sport" name="sport">
          <option value="football">Football</option>
          <option value="basketball">Basketball</option>
          <option value="baseball">Baseball</option>
          <option value="hockey">Hockey</option>
          <option value="all sports">All Sports</option>
        </select>
      </div>
    </div>
    <!-- ===== The four categories =====
         Each category is a <fieldset> (a group of related fields).
         - The <legend> names the group for screen readers. It is
         visually hidden because the colors already show the
         difficulty on screen.
         - aria-label gives each input a clear name ("Category 1,
         athlete 2"), since a placeholder is not a reliable label.
         - The first input is the category name; the CSS gives it
         its color via #category1-#category4.
         - "required" = the browser won't submit while it's empty. -->
    <div class="categories">
      <!-- Category 1 - easiest (yellow) -->
      <fieldset class="category">
        <legend class="visually-hidden">Category 1 (easiest, yellow)</legend>
        <input type="text" name="category1" id="category1" placeholder="Category 1" aria-label="Category 1 name" required>
        <input type="text" name="cat1-athlete1" id="cat1-athlete1" placeholder="Athlete 1" aria-label="Category 1, athlete 1" required>
        <input type="text" name="cat1-athlete2" id="cat1-athlete2" placeholder="Athlete 2" aria-label="Category 1, athlete 2" required>
        <input type="text" name="cat1-athlete3" id="cat1-athlete3" placeholder="Athlete 3" aria-label="Category 1, athlete 3" required>
        <input type="text" name="cat1-athlete4" id="cat1-athlete4" placeholder="Athlete 4" aria-label="Category 1, athlete 4" required>
      </fieldset>
      <!-- Category 2 - green -->
      <fieldset class="category">
        <legend class="visually-hidden">Category 2 (green)</legend>
        <input type="text" name="category2" id="category2" placeholder="Category 2" aria-label="Category 2 name" required>
        <input type="text" name="cat2-athlete1" id="cat2-athlete1" placeholder="Athlete 1" aria-label="Category 2, athlete 1" required>
        <input type="text" name="cat2-athlete2" id="cat2-athlete2" placeholder="Athlete 2" aria-label="Category 2, athlete 2" required>
        <input type="text" name="cat2-athlete3" id="cat2-athlete3" placeholder="Athlete 3" aria-label="Category 2, athlete 3" required>
        <input type="text" name="cat2-athlete4" id="cat2-athlete4" placeholder="Athlete 4" aria-label="Category 2, athlete 4" required>
      </fieldset>
      <!-- Category 3 - blue -->
      <fieldset class="category">
        <legend class="visually-hidden">Category 3 (blue)</legend>
        <input type="text" name="category3" id="category3" placeholder="Category 3" aria-label="Category 3 name" required>
        <input type="text" name="cat3-athlete1" id="cat3-athlete1" placeholder="Athlete 1" aria-label="Category 3, athlete 1" required>
        <input type="text" name="cat3-athlete2" id="cat3-athlete2" placeholder="Athlete 2" aria-label="Category 3, athlete 2" required>
        <input type="text" name="cat3-athlete3" id="cat3-athlete3" placeholder="Athlete 3" aria-label="Category 3, athlete 3" required>
        <input type="text" name="cat3-athlete4" id="cat3-athlete4" placeholder="Athlete 4" aria-label="Category 3, athlete 4" required>
      </fieldset>
      <!-- Category 4 - hardest (purple) -->
      <fieldset class="category">
        <legend class="visually-hidden">Category 4 (hardest, purple)</legend>
        <input type="text" name="category4" id="category4" placeholder="Category 4" aria-label="Category 4 name" required>
        <input type="text" name="cat4-athlete1" id="cat4-athlete1" placeholder="Athlete 1" aria-label="Category 4, athlete 1" required>
        <input type="text" name="cat4-athlete2" id="cat4-athlete2" placeholder="Athlete 2" aria-label="Category 4, athlete 2" required>
        <input type="text" name="cat4-athlete3" id="cat4-athlete3" placeholder="Athlete 3" aria-label="Category 4, athlete 3" required>
        <input type="text" name="cat4-athlete4" id="cat4-athlete4" placeholder="Athlete 4" aria-label="Category 4, athlete 4" required>
      </fieldset>
    </div>
    <div class="note">
      <p>Rows go from easiest (yellow) to hardest (purple).</p>
    </div>
    <!-- type="submit" = submits the form (after the required
         fields are checked). -->
    <div class="submitSection">
      <button type="submit" class="button submitButton">Submit</button>
    </div>
  </form>
</main>
</body>
</html>
